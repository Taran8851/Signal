# SearXNG for Firecrawl's /search, on the private Docker network only (not reachable from outside).
use_default_settings: true
server:
  limiter: false          # only Firecrawl calls it, over the internal network
  image_proxy: false
  secret_key: "overridden by SEARXNG_SECRET"
search:
  formats: [html, json]   # Firecrawl reads JSON
  safe_search: 0
ui:
  static_use_hash: true

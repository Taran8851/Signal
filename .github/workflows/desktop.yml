# Builds the desktop app (app/desktop) for Windows and Linux with Tauri's own action.
# Every run keeps the installers as build artifacts (Actions → the run → Artifacts).
# Pushing a tag like v0.2.6 also makes a draft GitHub Release with them; nothing is
# published until the draft is published by hand.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["app/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write   # the draft release on a tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      HAS_INSIDER: ${{ secrets.SIGNAL_INSIDER_CONFIG != '' }}
      HAS_DEPLOY: ${{ secrets.VPS_DEPLOY_KEY != '' && secrets.VPS_DEPLOY_HOST != '' }}
    steps:
      # app/frontend/tokens.css is a symlink to the landing page's copy; without this,
      # Windows checks it out as a text file holding the path, and the app loses its styles.
      - run: git config --global core.symlinks true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Registry and git checkouts only. With the target folder cached, V8's build step was restored
      # as done while the library it downloads was not: "could not find native static library rusty_v8".
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri -> target
          cache-targets: "false"

      # Obscura's stealth feature builds BoringSSL: cmake is on both runners, NASM isn't on Windows.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev

      - run: npm ci
        working-directory: app/desktop

      # Insider builds: the gateway settings ({ gateway, model, name }) come from a repository
      # secret, not the repo. Without the secret (every fork) this is a plain build.
      - name: Insider config
        if: env.HAS_INSIDER == 'true'
        shell: bash
        env:
          INSIDER: ${{ secrets.SIGNAL_INSIDER_CONFIG }}
        run: |
          printf '%s' "$INSIDER" > "$RUNNER_TEMP/insider.json"
          echo "SIGNAL_INSIDER_CONFIG=$RUNNER_TEMP/insider.json" >> "$GITHUB_ENV"

      # Compile first, on its own: when it fails, the errors become annotations, which GitHub
      # shows on the run page (and in its public API) without opening the full log.
      - name: Compile
        shell: bash
        working-directory: app/desktop
        run: |
          node scripts/copy-app.mjs
          cd src-tauri
          set +e
          cargo build --release 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error|-->|= note" ../build.log | grep -v "Compiling" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$status"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/desktop
          tauriScript: npx tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Signal ${{ github.ref_name }}
          releaseDraft: true

      # Publish to the website's download folder (secrets VPS_DEPLOY_KEY: a key that can only
      # write there, and VPS_DEPLOY_HOST: user@host). Without both, the installers stay as build
      # artifacts only.
      - name: Upload to the website
        if: env.HAS_DEPLOY == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
        run: |
          key="$RUNNER_TEMP/deploy_key"; printf '%s\n' "$DEPLOY_KEY" > "$key"; chmod 600 "$key"
          cd app/desktop/src-tauri/target/release/bundle
          for f in nsis/*.exe msi/*.msi deb/*.deb appimage/*.AppImage; do
            [ -f "$f" ] && scp -i "$key" -o StrictHostKeyChecking=accept-new "$f" "$DEPLOY_HOST:"
          done
          rm -f "$key"

      - uses: actions/upload-artifact@v4
        with:
          name: signal-${{ runner.os }}
          path: |
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe
            app/desktop/src-tauri/target/release/bundle/msi/*.msi
            app/desktop/src-tauri/target/release/bundle/deb/*.deb
            app/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
